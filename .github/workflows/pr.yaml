name: PR

on:
  pull_request:

permissions: {}

jobs:
  changelog:
    name: Validating changelog
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check CHANGELOG.md is updated
        run: |
          if ! git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" | grep -qE '^charts/dagster-code-location/CHANGELOG\.md$'; then
            echo "charts/dagster-code-location/CHANGELOG.md was not updated. Please document your changes before merging."
            exit 1
          fi

  docs:
    name: Validating docs
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Generate docs
        run: make docs

      - name: Check for uncommitted doc changes
        run: |
          if ! git diff --exit-code -- charts/dagster-code-location/README.md; then
            echo ""
            echo "Chart README is out of date. Run 'make docs' locally and commit the result."
            exit 1
          fi

  lint-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: "v3.17.0"

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: 3.x

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --config ct.yaml)
          echo "Changed charts:"
          echo "$changed"

          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Add Helm repositories
        run: |
          helm repo add kvalitetsit https://raw.githubusercontent.com/KvalitetsIT/helm-repo/master/
          helm repo update

      - name: Run chart-testing (lint)
        run: ct lint --config ct.yaml

      - name: Kubernetes KinD Cluster
        id: kind
        uses: helm/kind-action@92086f6be054225fa813e0a4b13787fc9088faab # v1.13.0
        if: steps.list-changed.outputs.changed == 'true'

      - name: Update chart dependencies
        if: steps.list-changed.outputs.changed == 'true'
        run: helm dependency update charts/dagster-code-location

      - name: Install CRDs
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          # Poll the Established condition instead of `kubectl wait`: a freshly server-side-applied
          # CRD may briefly have a nil .status.conditions, which makes `kubectl wait` error out
          # rather than wait. An empty jsonpath result just retries.
          wait_for_crd() {
            local crd="$1"
            for _ in $(seq 1 30); do
              [ "$(kubectl get crd "$crd" -o jsonpath='{.status.conditions[?(@.type=="Established")].status}' 2>/dev/null)" = "True" ] && return 0
              sleep 2
            done
            echo "Timed out waiting for CRD ${crd} to be Established" >&2
            return 1
          }

          kubectl apply -f https://raw.githubusercontent.com/cilium/cilium/refs/tags/v1.19.0/pkg/k8s/apis/cilium.io/client/crds/v2/ciliumnetworkpolicies.yaml
          wait_for_crd ciliumnetworkpolicies.cilium.io

      - name: Create code-location prerequisites
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          # A code location is not self-contained: in a KDS tenant namespace the image pull secret, the
          # Dagster metadata credentials and the location's own secrets and config are reflected in by
          # the platform, and the definitions come from the location's own image. `ct install` gets none
          # of that, so stub it here or the code server never reaches Ready and helm's --wait times out.
          # ghcr-pull is for a registry the ci/ values do not pull from, so the public image still pulls
          # anonymously; it only has to exist for the kubelet.
          kubectl create configmap ci-definitions --namespace default \
            --from-file=definitions.py=.github/ci/definitions.py
          kubectl create secret docker-registry ghcr-pull --namespace default \
            --docker-server=ghcr.io --docker-username=ci --docker-password=ci
          kubectl create secret generic postgres-dagster-credentials --namespace default \
            --from-literal=postgresql-password=ci
          kubectl create secret generic full-location-extra --namespace default \
            --from-literal=token=ci
          kubectl create secret generic full-location-env --namespace default \
            --from-literal=EXAMPLE_ENV_FROM_SECRET=ci
          kubectl create configmap extra-config --namespace default \
            --from-literal=extra.conf=ci

      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct install --config ct.yaml
