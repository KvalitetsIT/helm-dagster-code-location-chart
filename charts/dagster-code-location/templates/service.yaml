apiVersion: v1
kind: Service
metadata:
  name: {{ include "dagster-code-location.name" . }}
  labels:
    {{- include "dagster-code-location.labels" . | nindent 4 }}
    {{- include "dagster-code-location.discoveryLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "dagster-code-location.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: 4000
      targetPort: grpc
      protocol: TCP
